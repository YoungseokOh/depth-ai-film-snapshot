<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nextchip Depth AI Film</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600&display=swap">
<style>
/* Layout: a screening room. One film, edge to edge on a navy ground taken from the film's own end card;
   the Nextchip logo top left and one title top right, nothing else. Single dark look by design. */
:root {
  color-scheme: dark;
  --ground: #0a111d;      /* the film's end-card navy */
  --ground-hi: #13203a;   /* the vignette's lit centre */
  --ink: #e6e9ef;
  --ink-dim: #9aa3b2;
  --frame: #1d2a40;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 90% at 50% 40%, var(--ground-hi), var(--ground) 70%) fixed, var(--ground);
  color: var(--ink);
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: clamp(20px, 4vh, 48px);
  display: flex; flex-direction: column; align-items: center;
}
.room { width: min(100%, 1280px); display: flex; flex-direction: column; gap: clamp(14px, 2.4vh, 24px); }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.what { font-family: "Sora", system-ui, sans-serif; font-weight: 600; color: var(--ink); font-size: clamp(16px, 1.8vw, 23px); letter-spacing: 0.03em; white-space: nowrap; }
.logo { display: block; height: clamp(24px, 3vw, 36px); width: auto; }
.screen { position: relative; border-radius: 6px; overflow: hidden; background: #000;
  box-shadow: 0 0 0 1px var(--frame), 0 30px 80px -30px rgba(0, 0, 0, 0.8); }
video { display: block; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; }
video:focus-visible { outline: 2px solid #3e9bfe; outline-offset: 3px; }
</style>
</head><body>
<main class="room">
  <header>
    <img class="logo" src="logo.png" alt="nextchip">
    <span class="what">Depth AI</span>
  </header>
  <div class="screen">
    <video id="film" controls playsinline preload="metadata" poster="poster.jpg">
      <source src="film.mp4" type="video/mp4">
      <source src="film.webm" type="video/webm">
    </video>
  </div>
</main>
</body></html>
